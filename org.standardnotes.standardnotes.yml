app-id: org.standardnotes.standardnotes
runtime: org.freedesktop.Platform
runtime-version: &runtime-version '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: *runtime-version
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: start-standardnotes
finish-args:
  # camera access for moments
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  # Tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  # Legacy text backup directory: https://github.com/standardnotes/app/blob/6a7c5277f8a957944fea59ce146a7aecdaa52da7/packages/desktop/app/javascripts/Main/FileBackups/FileBackupsManager.ts#L105
  - --persist=Standard Notes Backups
  # For backups
  - --persist=Documents
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
  - --env=XCURSOR_PATH=~/.icons:/app/share/icons:/icons:/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: dbus-run-session
    buildsystem: cmake
    cleanup: ['*']
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/dbus/dbus/-/archive/dbus-1.16.2/dbus-dbus-1.16.2.tar.gz
        sha256: d77cc71acd93e85f2bd2a6fe3a40e5bd023519e3e9fa9b5361e7109f42b74060
        x-checker-data:
          type: anitya
          project-id: 5356
          url-template: https://gitlab.freedesktop.org/dbus/dbus/-/archive/dbus-$version/dbus-dbus-$version.tar.gz

  - name: standardnotes
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        XDG_CACHE_HOME: /run/build/standardnotes/flatpak-node/cache
        npm_config_nodedir: /usr/lib/sdk/node22
        # Offline Yarn Berry settings
        YARN_ENABLE_INLINE_BUILDS: '1'
        YARN_ENABLE_TELEMETRY: '0'
        YARN_ENABLE_NETWORK: '0'
        YARN_ENABLE_GLOBAL_CACHE: '0'
        YARN_GLOBAL_FOLDER: /run/build/standardnotes/flatpak-node/yarn-berry
        # Electron builder offline cache
        electron_config_cache: /run/build/standardnotes/flatpak-node/cache/electron
        ELECTRON_BUILDER_OFFLINE: 'true'
    build-commands:
      # 1. Install dependencies offline from pre-cached Yarn Berry sources
      - yarn install --immutable

      # 2. Rebuild native modules against the mounted Node 22 SDK headers
      - yarn workspace @standardnotes/desktop rebuild:home-server

      # 3. Build workspace packages (SNJS, utils, web) followed by desktop bundle
      - yarn build:desktop
      - cd packages/desktop && yarn run webpack --config desktop.webpack.prod.js

      # 4. Package Linux directory target using electron-builder
      - |
        case "${FLATPAK_ARCH}" in
          x86_64)  ARCH_FLAG="--x64" ;;
          aarch64) ARCH_FLAG="--arm64" ;;
          *) echo "Unsupported architecture ${FLATPAK_ARCH}" && exit 1 ;;
        esac
        cd packages/desktop
        yarn run electron-builder --linux --dir ${ARCH_FLAG} \
          --publish=never -c.extraMetadata.version=$(node -p "require('./package.json').version")

      # 5. Install application files and desktop assets
      - |
        cd packages/desktop
        rm -f dist/linux*-unpacked/chrome-sandbox
        cp -r dist/linux*-unpacked ${FLATPAK_DEST}/standardnotes

        # To allow separate locales
        # https://searchfox.org/mozilla-central/rev/8a4f55bc09ffc5c25dcb4586c51ae4a9fee77b4c/taskcluster/docker/firefox-flatpak/runme.sh#131-133
        for lang in ${FLATPAK_DEST}/standardnotes/locales/*.pak
        do
          locale="$(basename -s .pak $lang)"
          install -Dm644 -t "${FLATPAK_DEST}/share/runtime/locale/${locale%%-*}/" "$lang"
          ln -sf "${FLATPAK_DEST}/share/runtime/locale/${locale%%-*}/$(basename $lang)" "${FLATPAK_DEST}/standardnotes/locales/$(basename $lang)"
        done

        for size in 256 512; do
          if [ -f "app/icon/Icon-${size}x${size}.png" ]; then
            install -Dm644 "app/icon/Icon-${size}x${size}.png" \
              "${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png"
          fi
        done
        if [ -f "usr/share/applications/standard-notes.desktop" ]; then
          install -Dm644 usr/share/applications/standard-notes.desktop "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
        else
          install -Dm644 ../../org.standardnotes.standardnotes.desktop "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
        fi
        desktop-file-edit --set-key=Exec --set-value='start-standardnotes %U' --set-icon=${FLATPAK_ID} \
          "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"

    sources:
      - type: git
        url: https://github.com/standardnotes/app.git
        tag: '@standardnotes/desktop@3.202.12'
        commit: e2703c968551decc36bfaa42a7579437754955c4
        x-checker-data:
          type: anitya
          project-id: 146681
          tag-template: '@standardnotes/desktop@$version'
          stable-only: true

      - generated-sources.json

      - type: file
        path: org.standardnotes.standardnotes.desktop

  - name: start-script
    buildsystem: simple
    build-commands:
      # Install the wrapper script to start it.
      - install -Dm 755 start-standardnotes.sh /app/bin/start-standardnotes
    sources:
      - type: file
        path: start-standardnotes.sh

  - name: metainfo
    buildsystem: simple
    build-commands:
      - install -Dm644 org.standardnotes.standardnotes.metainfo.xml /app/share/metainfo/$FLATPAK_ID.metainfo.xml
    sources:
      - type: file
        path: org.standardnotes.standardnotes.metainfo.xml
